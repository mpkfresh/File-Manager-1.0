name: Reviewed Windows release build

# Dispatch only after the owner approves the exact reviewed source commit and
# the local source-manifest-to-commit guard has passed. This workflow neither
# signs nor uploads a release artifact. Its media outputs remain unapproved
# until the owner reviews exact hosted bytes and the V1-to-V2 handoff.
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full reviewed source commit ID
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require the reviewed dispatch commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPROVED_COMMIT -cnotmatch '^[0-9a-fA-F]{40}$') {
            throw 'A full 40-character reviewed commit ID is required.'
          }
          if ($env:GITHUB_SHA.ToLowerInvariant() -cne $env:APPROVED_COMMIT.ToLowerInvariant()) {
            throw 'The dispatched workflow revision differs from the reviewed commit.'
          }

      - name: Fetch only the reviewed public commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REPOSITORY -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'Unexpected GitHub repository identity.'
          }
          $remote = "$env:GITHUB_SERVER_URL/$env:REPOSITORY.git"
          & git init $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE) { throw 'Git init failed.' }
          & git -C $env:GITHUB_WORKSPACE remote add origin $remote
          if ($LASTEXITCODE) { throw 'Git remote setup failed.' }
          & git -C $env:GITHUB_WORKSPACE fetch --no-tags --depth=1 origin $env:GITHUB_REF
          if ($LASTEXITCODE) { throw 'Git fetch failed.' }
          & git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Git checkout failed.' }
          $head = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($LASTEXITCODE -or $head.ToLowerInvariant() -cne $env:APPROVED_COMMIT.ToLowerInvariant()) {
            throw 'Checked-out source is not the approved commit.'
          }
          $status = @(& git -C $env:GITHUB_WORKSPACE status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -or $status.Count -ne 0) {
            throw 'The reviewed checkout is not clean.'
          }
          if (-not (Test-Path -LiteralPath '.github/workflows/windows-release-reviewed.yml' -PathType Leaf)) {
            throw 'The reviewed workflow is absent from the checked-out commit.'
          }
          Write-Output "Reviewed commit: $head"

      - name: Preflight the pinned Windows media toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) `
            'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = @(& $vswhere -latest -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath)
          if ($LASTEXITCODE -or $vsRoot.Count -ne 1) {
            throw 'One Visual Studio 2022 C++ installation is required.'
          }
          foreach ($required in @(
            (Join-Path $vsRoot[0] 'VC/Auxiliary/Build/vcvars64.bat'),
            (Join-Path $vsRoot[0] 'VC/Tools/MSVC/14.44.35207')
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw 'The pinned MSVC 14.44.35207 toolchain is unavailable.'
            }
          }
          foreach ($tool in @('7z.exe', 'cmake.exe', 'ninja.exe',
              'python.exe', 'git.exe')) {
            (Get-Command $tool -ErrorAction Stop).Source | Out-Null
          }
          Write-Output 'Pinned Windows media build prerequisites are present.'

      - name: Fetch and hash-pin the proposed Qt 6.11.2 MSVC 2022 kit
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64'
          $platform = 'Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z'
          $components = @(
            @{ name='qtbase'; path='qt.qt6.6112.win64_msvc2022_64'; sha='FD984B7264361B4DD3FD2A417702CA1258E4086268F2EE6A69B9A393D9C3F6BB' },
            @{ name='qtsvg'; path='qt.qt6.6112.win64_msvc2022_64'; sha='417F44499C835B2303F3FF78043179BB23442F33D5D2816FBF7E8DBF275B1C89' },
            @{ name='qttools'; path='qt.qt6.6112.win64_msvc2022_64'; sha='5F2B387A1F8055102B1388FF4EA743124ED6389D442F75C659728BB5C2A56946' },
            @{ name='qtmultimedia'; path='qt.qt6.6112.addons.qtmultimedia.win64_msvc2022_64'; sha='24D73C45FEFE5E260AA9A99EEA1AEA48ADCAD54F93BDDAA3EC5B0574B55F57C7' }
          )
          $archives = Join-Path $env:RUNNER_TEMP 'filemanager-qt-archives'
          $kit = Join-Path $env:RUNNER_TEMP 'filemanager-qt-kit'
          New-Item -ItemType Directory -Path $archives,$kit -ErrorAction Stop | Out-Null
          $extractor = (Get-Command 7z.exe -ErrorAction Stop).Source
          foreach ($component in $components) {
            $filename = "6.11.2-0-202608131017$($component.name)-$platform"
            $uri = "$base/$($component.path)/$filename"
            $archive = Join-Path $archives $filename
            Invoke-WebRequest -Uri $uri -OutFile $archive -ErrorAction Stop
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            if ($hash -cne $component.sha) {
              throw "Official Qt archive hash mismatch: $($component.name)"
            }
            & $extractor x $archive "-o$kit" -y
            if ($LASTEXITCODE) { throw "Qt extraction failed: $($component.name)" }
            Write-Output "$($component.name) archive SHA-256 $hash"
          }
          $configs = @(Get-ChildItem -LiteralPath $kit -Filter Qt6Config.cmake -File -Recurse)
          if ($configs.Count -ne 1) { throw 'Expected exactly one extracted Qt6Config.cmake.' }
          $prefix = $configs[0].Directory.Parent.Parent.Parent.FullName
          foreach ($required in @('bin/Qt6Core.dll','bin/Qt6Multimedia.dll','bin/windeployqt.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $prefix $required) -PathType Leaf)) {
              throw "Qt kit is missing $required"
            }
          }
          "FILE_MANAGER_QT_PREFIX=$prefix" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'Qt kit is hash-pinned; final acceptance still requires V1 byte comparison and attribution.'

      - name: Rebuild the reviewed seven-file media candidate on the hosted runner
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'fm-media-tools'
          $companionRoot = Join-Path $env:RUNNER_TEMP 'fm-media-companion'
          $mediaRoot = Join-Path $env:RUNNER_TEMP 'fm-media-build'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & ./tools/Acquire-HostedMediaTools.ps1 -OutputRoot $toolRoot -SevenZipExe $sevenZip
          $companionText = Join-Path $env:GITHUB_WORKSPACE 'packaging/media-source-companion-text'
          & ./tools/Assemble-HostedMediaCompanion.ps1 `
            -TextDirectory $companionText `
            -OutputDirectory $companionRoot
          $shaderConfigs = @(Get-ChildItem -LiteralPath (Join-Path $toolRoot 'qtshadertools') `
            -Recurse -File -Filter Qt6ShaderToolsConfig.cmake)
          if ($shaderConfigs.Count -ne 1) { throw 'ShaderTools prefix is ambiguous.' }
          $shaderPrefix = $shaderConfigs[0].Directory.Parent.Parent.Parent.FullName
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) `
            'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = @(& $vswhere -latest -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath)
          if ($LASTEXITCODE -or $vsRoot.Count -ne 1) {
            throw 'One Visual Studio 2022 C++ installation is required.'
          }
          $vcvars = Join-Path $vsRoot[0] 'VC/Auxiliary/Build/vcvars64.bat'
          & ./tools/Build-ReviewedMediaFromCompanion.ps1 `
            -CompanionDirectory $companionRoot -OutputRoot $mediaRoot `
            -MsysBin (Join-Path $toolRoot 'msys64/usr/bin') `
            -QtPrefix $env:FILE_MANAGER_QT_PREFIX `
            -ShaderToolsPrefix $shaderPrefix -VcVars64 $vcvars `
            -CMakeExe (Get-Command cmake.exe -ErrorAction Stop).Source `
            -NinjaExe (Get-Command ninja.exe -ErrorAction Stop).Source `
            -PythonExe (Get-Command python.exe -ErrorAction Stop).Source `
            -GitExe (Get-Command git.exe -ErrorAction Stop).Source
          $result = Get-Content -LiteralPath (Join-Path $mediaRoot 'reports/media-build-result.json') `
            -Raw | ConvertFrom-Json
          if ($result.status -cne 'built-unreviewed' -or $result.releaseApproved -ne $false -or
              @($result.mediaFiles.PSObject.Properties).Count -ne 7) {
            throw 'Media build did not leave exactly seven review-only outputs.'
          }
          "FILE_MANAGER_MEDIA_STAGE=$(Join-Path $mediaRoot 'seven-media-stage')" |
            Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "FILE_MANAGER_MEDIA_RESULT=$(Join-Path $mediaRoot 'reports/media-build-result.json')" |
            Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'Seven media candidate files built and hash-recorded on GitHub-hosted Windows; no package or artifact uploaded.'

      - name: Configure and build the reviewed Release preset
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion"
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsVersion = @(& $vswhere -latest -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion)
          if ($LASTEXITCODE -or $vsVersion.Count -ne 1 -or [string]::IsNullOrWhiteSpace($vsVersion[0])) {
            throw 'VS2022 C++ toolchain is unavailable.'
          }
          Write-Output "VS2022 version: $($vsVersion[0])"
          & cmake --version
          if ($LASTEXITCODE) { throw 'CMake is unavailable.' }
          & cmake --preset windows-release-reviewed
          if ($LASTEXITCODE) { throw 'Reviewed Release configure failed.' }
          Get-Content 'out/build/windows-release-reviewed/CMakeCache.txt' |
            Select-String '^CMAKE_(VS_WINDOWS_TARGET_PLATFORM_VERSION|CXX_COMPILER|C_COMPILER):' |
            ForEach-Object { Write-Output $_.Line }
          & cmake --build --preset windows-release-reviewed --parallel 4
          if ($LASTEXITCODE) { throw 'Reviewed Release build failed.' }
          $bin = 'out/build/windows-release-reviewed/Release'
          foreach ($name in @('FileManager','FileManagerShellHost','FileManagerPreviewHost','FileManagerContextMenuHost','FileManagerMaintenance','FileManagerCoreTests','FileManagerVisualTests','FileManagerWorkspaceTests')) {
            $path = Join-Path $bin "$name.exe"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing built binary: $name" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            Write-Output "$name SHA-256 $hash"
          }
          foreach ($file in Get-ChildItem -LiteralPath $bin -Filter 'FileManager*Tests.exe' -File) {
            Write-Output "$($file.Name) SHA-256 $((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash)"
          }
          Write-Output "Qt Core SHA-256 $((Get-FileHash -LiteralPath (Join-Path $env:FILE_MANAGER_QT_PREFIX 'bin/Qt6Core.dll') -Algorithm SHA256).Hash)"

      - name: Check consumed dependency source trees
        run: |
          $ErrorActionPreference = 'Stop'
          $record = 'out/build/windows-release-reviewed/file-manager-dependency-sources.txt'
          $hash = (Get-FileHash -LiteralPath $record -Algorithm SHA256).Hash
          $report = Join-Path $env:RUNNER_TEMP 'filemanager-dependency-origins.json'
          & python tools/Verify-DependencySourceOrigins.py --record $record --record-sha256 $hash --report $report
          if ($LASTEXITCODE) { throw 'The consumed dependency sources do not match their pinned commits.' }
          Get-Content -LiteralPath $report -Raw

      - name: Check 1.0 identity and deployed notices
        run: |
          $ErrorActionPreference = 'Stop'
          $build = 'out/build/windows-release-reviewed'
          $bin = Join-Path $build 'Release'
          $cache = Get-Content -LiteralPath (Join-Path $build 'CMakeCache.txt')
          foreach ($required in @('FILE_MANAGER_BUILD_VERSION:STRING=1.0.0',
              'FILE_MANAGER_RELEASE_CHANNEL:STRING=',
              'FILE_MANAGER_PUBLISHER:STRING=Kiatami')) {
            if (-not ($cache -ccontains $required)) {
              throw 'The final 1.0 build identity differs from the reviewed preset.'
            }
          }
          foreach ($name in @('FileManager.exe', 'FileManagerShellHost.exe',
              'FileManagerPreviewHost.exe', 'FileManagerContextMenuHost.exe',
              'FileManagerMaintenance.exe')) {
            $path = Join-Path $bin $name
            $version = (Get-Item -LiteralPath $path -ErrorAction Stop).VersionInfo
            if ($version.FileVersion -cne '1.0.0' -or
                $version.ProductVersion -cne '1.0.0' -or
                $version.CompanyName -cne 'Kiatami' -or
                $version.ProductName -cne 'File Manager' -or
                $version.OriginalFilename -cne $name) {
              throw "The final executable identity differs: $name"
            }
          }
          foreach ($relative in @('THIRD_PARTY_NOTICES.md',
              'licenses/Windows-SDK-Third-Party-Notices.rtf')) {
            $source = if ($relative -eq 'THIRD_PARTY_NOTICES.md') {
              $relative
            } else {
              'resources/licenses/Windows-SDK-Third-Party-Notices.rtf'
            }
            $target = Join-Path $bin $relative.Replace('/', '\')
            $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
            $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
            if ($sourceHash -cne $targetHash) {
              throw "The staged release notice differs: $relative"
            }
            Write-Output "$relative SHA-256 $targetHash"
          }
          Write-Output 'Final 1.0 executable identities and two staged notices matched.'

      - name: Check the base Qt deployment before replacing media
        run: |
          $ErrorActionPreference = 'Stop'
          & ctest --test-dir out/build/windows-release-reviewed -C Release `
            --timeout 180 -R '^FileManagerDependencyTests$'
          if ($LASTEXITCODE) { throw 'Base Qt deployment check failed.' }
          Write-Output 'Base deployment passed; the final seven-file payload remains a separate gate.'

      - name: Bind deployed shader DLLs to Qt-listed sources
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'out/build/windows-release-reviewed/Release'
          $deploy = Join-Path $env:FILE_MANAGER_QT_PREFIX 'bin/windeployqt.exe'
          $clean = Join-Path $env:RUNNER_TEMP 'filemanager-clean-qt-map'
          New-Item -ItemType Directory -Path $clean -ErrorAction Stop | Out-Null
          $cleanExe = Join-Path $clean 'FileManager.exe'
          Copy-Item -LiteralPath (Join-Path $bin 'FileManager.exe') -Destination $cleanExe -ErrorAction Stop
          $stderrFile = Join-Path $env:RUNNER_TEMP 'filemanager-windeployqt.stderr.txt'
          $sourceLines = @(& $deploy --dry-run --list source --no-translations --compiler-runtime --exclude-plugins qsqlibase,qsqlmimer,qsqloci,qsqlodbc,qsqlpsql $cleanExe 2> $stderrFile)
          if ($LASTEXITCODE -ne 0 -or $sourceLines.Count -eq 0) {
            throw 'Qt dry-run deployment source listing failed.'
          }
          $sourceList = Join-Path $env:RUNNER_TEMP 'filemanager-windeployqt-sources.txt'
          $sourceLines | Set-Content -LiteralPath $sourceList -Encoding utf8NoBOM
          $report = Join-Path $env:RUNNER_TEMP 'filemanager-shader-origins.json'
          $sourceHash = (Get-FileHash -LiteralPath $sourceList -Algorithm SHA256).Hash
          $toolHash = (Get-FileHash -LiteralPath $deploy -Algorithm SHA256).Hash
          $output = & python tools/Verify-ShaderCompilerOrigins.py --source-list $sourceList --source-list-sha256 $sourceHash --selected-qt-prefix $env:FILE_MANAGER_QT_PREFIX --deploy-tool $deploy --deploy-tool-sha256 $toolHash --stage $bin --report $report 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw 'The staged shader DLLs do not match Qt-listed source files.'
          }
          $origin = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($origin.status -cne 'matched' -or @($origin.files).Count -ne 3) {
            throw 'Shader compiler origin report is incomplete.'
          }
          foreach ($file in $origin.files) {
            Write-Output "$($file.name) SHA-256 $($file.sha256)"
          }
          Write-Output "Qt deployment tool SHA-256 $toolHash"

      - name: Overlay rebuilt media and run the affected V1 checks
        run: |
          $ErrorActionPreference = 'Stop'
          $media = Get-Content -LiteralPath $env:FILE_MANAGER_MEDIA_RESULT -Raw |
            ConvertFrom-Json
          if ($media.status -cne 'built-unreviewed' -or $media.releaseApproved -ne $false) {
            throw 'Only a seven-file review candidate may enter this V1 runtime.'
          }
          $bin = 'out/build/windows-release-reviewed/Release'
          $mediaNames = @('avcodec-61.dll', 'avformat-61.dll', 'avutil-59.dll',
            'swresample-5.dll', 'swscale-8.dll', 'Qt6Multimedia.dll',
            'multimedia/ffmpegmediaplugin.dll')
          if (@($media.mediaFiles.PSObject.Properties).Count -ne $mediaNames.Count) {
            throw 'The rebuilt media manifest is not exactly seven files.'
          }
          foreach ($relative in $mediaNames) {
            $property = $media.mediaFiles.PSObject.Properties[$relative]
            if ($null -eq $property -or [string]$property.Value -cnotmatch '^[A-Fa-f0-9]{64}$') {
              throw "The media manifest lacks $relative."
            }
            $source = Join-Path $env:FILE_MANAGER_MEDIA_STAGE $relative.Replace('/', '\')
            $target = Join-Path $bin $relative.Replace('/', '\')
            $sourceItem = Get-Item -LiteralPath $source -Force -ErrorAction Stop
            if ($sourceItem -isnot [IO.FileInfo] -or
                ($sourceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ine $property.Value) {
              throw "The rebuilt media source differs: $relative"
            }
            Copy-Item -LiteralPath $source -Destination $target -Force -ErrorAction Stop
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
            if ($actual -ine $property.Value) { throw "Media overlay differs: $relative" }
            Write-Output "$relative SHA-256 $actual"
          }
          $vendorSbom = Join-Path $bin 'sbom/qtmultimedia-6.11.2.cdx.json'
          if (Test-Path -LiteralPath $vendorSbom -PathType Leaf) {
            Remove-Item -LiteralPath $vendorSbom -ErrorAction Stop
          }
          $testRoot = Join-Path $env:RUNNER_TEMP 'filemanager-v1-test-profile'
          $env:TMP = Join-Path $testRoot 'temp'
          $env:TEMP = $env:TMP
          $env:LOCALAPPDATA = Join-Path $testRoot 'local-app-data'
          $env:APPDATA = Join-Path $testRoot 'roaming-app-data'
          foreach ($directory in @($env:TMP, $env:LOCALAPPDATA, $env:APPDATA)) {
            New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
          }
          & ctest --test-dir out/build/windows-release-reviewed -C Release `
            --timeout 180 -R '^FileManagerCoreTests$'
          if ($LASTEXITCODE) { throw 'Core check failed on the rebuilt-media runtime.' }
          foreach ($case in @(
            @{ name='FileManagerVisualTests'; argument='--invariants-only' },
            @{ name='FileManagerWorkspaceTests'; argument='--cloud-preview-only' },
            @{ name='FileManagerWorkspaceTests'; argument='--ffmpeg-candidate-only' },
            @{ name='FileManagerWorkspaceTests'; argument='--ffmpeg-video-only' }
          )) {
            $label = "$($case.name)-$($case.argument.TrimStart('-'))"
            $out = Join-Path $env:RUNNER_TEMP "$label.stdout.txt"
            $err = Join-Path $env:RUNNER_TEMP "$label.stderr.txt"
            $process = Start-Process -FilePath (Join-Path $bin "$($case.name).exe") `
              -ArgumentList $case.argument -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $out -RedirectStandardError $err
            try {
              if (-not $process.WaitForExit(180000)) {
                $process.Kill($true)
                throw "$label exceeded 180 seconds."
              }
              if ($process.ExitCode -ne 0) {
                throw "$label failed: $($process.ExitCode)"
              }
            } finally {
              $process.Dispose()
            }
            Write-Output "$label passed; raw stdout/stderr stay on the runner."
          }
          $mp4 = Join-Path $env:RUNNER_TEMP 'fm-media-build/sources/qt/qtmultimedia-everywhere-src-6.11.2/tests/auto/integration/qmediaplayerbackend/testdata/3colors_with_sound_1s.mp4'
          $mp4Hash = '0593922D7CBFC91FC773940D00FFE32A060A83C8A1986B7BEDEF5EB3A74C5F39'
          if ((Get-FileHash -LiteralPath $mp4 -Algorithm SHA256).Hash -cne $mp4Hash) {
            throw 'The reviewed Qt compressed-video fixture differs.'
          }
          $mp4Out = Join-Path $env:RUNNER_TEMP 'ffmpeg-compressed-video.stdout.txt'
          $mp4Err = Join-Path $env:RUNNER_TEMP 'ffmpeg-compressed-video.stderr.txt'
          $mp4Process = Start-Process -FilePath (Join-Path $bin 'FileManagerWorkspaceTests.exe') -ArgumentList @('--ffmpeg-compressed-video-only', $mp4, $mp4Hash) -PassThru -WindowStyle Hidden -RedirectStandardOutput $mp4Out -RedirectStandardError $mp4Err
          try {
            if (-not $mp4Process.WaitForExit(180000)) {
              $mp4Process.Kill($true)
              throw 'Compressed-video check exceeded 180 seconds.'
            }
            if ($mp4Process.ExitCode -ne 0) {
              throw 'Compressed-video check failed.'
            }
          } finally {
            $mp4Process.Dispose()
          }
          Write-Output 'Restricted compressed-video check passed; raw logs stay on the runner.'

      - name: Record the exact V1 candidate bytes locally
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'out/build/windows-release-reviewed/Release'
          $media = Get-Content -LiteralPath $env:FILE_MANAGER_MEDIA_RESULT -Raw |
            ConvertFrom-Json
          $contract = @(Get-Content -LiteralPath 'packaging/release-payload-1.0.txt' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($contract.Count -ne 58 -or @($contract | Select-Object -Unique).Count -ne 58) {
            throw 'The 1.0 release path contract differs from 58 unique paths.'
          }
          $present = [Collections.Generic.List[object]]::new()
          $missing = [Collections.Generic.List[string]]::new()
          foreach ($relative in $contract) {
            if ($relative -notmatch '^[A-Za-z0-9._/-]+$' -or
                $relative.StartsWith('/') -or $relative.Contains('..')) {
              throw 'The release path contract contains an unsafe path.'
            }
            $path = Join-Path $bin $relative.Replace('/', '\')
            if (-not (Test-Path -LiteralPath $path)) {
              $missing.Add($relative)
              continue
            }
            $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if ($item -isnot [IO.FileInfo] -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "The V1 payload candidate has an unsafe item: $relative"
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            $mediaEntry = $media.mediaFiles.PSObject.Properties[$relative]
            if ($null -ne $mediaEntry -and $hash -ine [string]$mediaEntry.Value) {
              throw "The V1 media candidate differs: $relative"
            }
            $present.Add([ordered]@{ path=$relative; bytes=$item.Length; sha256=$hash })
          }
          if (@($media.mediaFiles.PSObject.Properties).Count -ne 7) {
            throw 'The media record must name exactly seven candidate files.'
          }
          foreach ($mediaEntry in $media.mediaFiles.PSObject.Properties) {
            if ($mediaEntry.Name -notin @($present | ForEach-Object { $_.path })) {
              throw 'A rebuilt media file is absent from the V1 candidate.'
            }
          }
          $record = [ordered]@{
            schema = 'file-manager-v1-local-handoff-candidate-v1'
            status = 'review-only'
            sourceCommit = $env:GITHUB_SHA
            mediaBuildResultSha256 = (Get-FileHash -LiteralPath `
              $env:FILE_MANAGER_MEDIA_RESULT -Algorithm SHA256).Hash
            presentFiles = $present.ToArray()
            missingReleasePaths = $missing.ToArray()
            releaseApproved = $false
            uploaded = $false
          }
          $record | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP `
              'filemanager-v1-handoff-candidate.json') -Encoding utf8NoBOM
          Write-Output "Recorded $($present.Count) of 58 release paths in a local review-only manifest; no artifact uploaded."
